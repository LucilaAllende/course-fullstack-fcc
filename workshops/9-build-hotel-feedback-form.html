<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Feedback Form</title>
</head>
<body>
  <header>
    <h1>Hotel Feedback Form</h1>
    <p>Thank you for staying with us. Please provide feedback on your recent stay.</p>
  </header>
  <main>
    <form action="https://hotel-feedback.freecodecamp.org" method="POST">
      <fieldset>
        <legend>Personal Information</legend>
        <label for="full-name">Name (required):</label>
        <input id="full-name" type="text" name="name" placeholder="e.g., John Doe" size="20" required>
        <label for="email">Email address (required):</label>
        <input id="email" type="email" name="email" placeholder="example@email.com" size="20" required>
        <label for="age">Age (optional): </label>
      </fieldset>
    </form>
  </main>
</body>
</html>
