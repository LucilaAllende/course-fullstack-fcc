<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multimedia Player</title>
</head>
<body>
  <h1>Multimedia Player</h1>

  <section>
    <h2>Colors</h2>
    <audio controls aria-label="song colors by black pumas">
      <source src="https://cdn.freecodecamp.org/curriculum/js-music-player/sailing-away.mp3" type="audio/mp3">
    </audio>
  </section>
  <section>
    <h2>Map method</h2>
    <video controls aria-label="video tutorial" width="600">
      <source src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.mp4" type="video/mp4">
    </video>
    <track src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.vtt"
      kind="captions"
      srclang="en"
      label="transcripcion"
    ></track>
  </section>
  <section>
    <h2>Transcript</h2>
    <p></p>
  </section>
</body>
</html>
