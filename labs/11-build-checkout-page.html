<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout Page</title>
</head>
<body>
  <h1>Checkout</h1>
  <section>
    <h2>Your Cart</h2>
    <img src="https://cdn.freecodecamp.org/curriculum/labs/cube.jpg" alt="cubo rubrik desordenado">
  </section>
  <section>
    <h2>Payment Information</h2>
    <form action="">
      <input type="text" name="card-name" id="card-name" required>
      <label for="card-name">Nombre</label>
      <input type="text" name="card-number" id="card-number" required>
      <label for="card-number">Numero</label>
    </form>
  </section>
</body>
</html>
