<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout Page</title>
</head>
<body>
  <h1>Checkout</h1>
  <section>
    <h2>Your Cart</h2>
    <img src="https://cdn.freecodecamp.org/curriculum/labs/cube.jpg" alt="cubo rubrik desordenado">
  </section>
  <section>
    <h2>Payment Information</h2>
    <form action="">
      <input type="text" name="card-name" id="card-name" required>
      <label for="card-name">Nombre <span aria-hidden="true">*</span></label>
      <input type="text" name="card-number" id="card-number" required aria-describedby="card-number-help">
      <p id="card-number-help">XXXX XXXX XXXX XXXX</p>
      <label for="card-number">Numero <span aria-hidden="true">*</span></label>
    </form>
  </section>
</body>
</html>
